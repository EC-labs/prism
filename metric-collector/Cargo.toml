[package]
name = "metric-collector"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "metric-collector"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[build-dependencies]
bindgen = "0.71.1"
libbpf-cargo = { version = "0.24.8" }
vmlinux = { version = "0.0", git = "https://github.com/libbpf/vmlinux.h.git", rev = "172793d6a409d98d1cfb843c80df73733e9f832f" }
anyhow = "1.0"

[dependencies]
syn = { version = "2.0.100", features = ["parsing", "full", "extra-traits"] }
chrono = "0.4.33"
regex = "1.10.3"
libc = "0.2.153"
nix = { version = "0.28.0", features = ["time"] }
lazy_static = "1.5.0"

anyhow = "1.0"
libbpf-rs = { version = "0.24.8" }
clap = { version = "4.0.32", default-features = false, features = ["std", "derive", "help", "usage", "cargo", "env", "wrap_help"] }
pnet = "0.35.0"

rdkafka = { version = "=0.34", features = ["dynamic-linking"] }
duckdb = { version = "0.9.2" }
log = "0.4.26"
env_logger = "0.11.6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"


bollard = "0.19.0"
tokio = { version = "1.45.1", features = ["full"] }
containerd-client = "0.8.0"
tonic = "0.12"
signal-hook = "0.4.3"
clickhouse = { version = "0.13.2", features = ["inserter"] }
rand = "0.10.1"
indoc = "2.0.7"
