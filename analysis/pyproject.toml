[project]
name = "src"
version = "0.1.0"
description = "Prism Performance Analysis Dashboard"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4.2",
    "matplotlib>=3.10.7",
    "networkx>=3.6",
    "streamlit[charts]==1.52.0",
    "streamlit-monaco>=0.1.3",
    "btrees>=6.3",
    "openpyxl>=3.1.5",
    "jinja2>=3.1.6",
]

[project.scripts]
analysis = "src:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "ruff>=0.14.6",
]
