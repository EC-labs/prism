apiVersion: v1
kind: Service
metadata:
  name: sample-clickhouse-nodeport
spec:
  type: NodePort
  selector:
    app: sample-clickhouse
  externalIPs: [ "10.0.0.1" ]
  ports:
    - nodePort: 30900
      port: 9000
      targetPort: 9000
      name: tcp
    - nodePort: 30123
      port: 8123
      targetPort: 8123
      name: http
